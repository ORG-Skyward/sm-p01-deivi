<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Django - GestioCore</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .card {
            background: white;
            padding: 30px 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            text-align: center;
            width: 320px;
        }
        h2 { color: #4a5568; margin-bottom: 20px; }
        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }
        label { display: block; font-size: 14px; color: #718096; margin-bottom: 5px; font-weight: 600; }
        input {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #cbd5e0;
            border-radius: 6px;
            font-size: 16px;
        }
        button {
            background: #319795;
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
            transition: background 0.3s;
        }
        button:hover { background: #2c7a7b; }
        .result {
            font-size: 20px;
            color: #2b6cb0;
            font-weight: bold;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>Calculadora Django</h2>
        
        <form method="POST">
            {% csrf_token %}
            <div class="input-group">
                <label for="num1">Primer Numero:</label>
                <input type="number" step="any" name="num1" value="{{ num1|default:'' }}" placeholder="Ej. 15" required>
            </div>
            
            <div class="input-group">
                <label for="num2">Segundo Numero:</label>
                <input type="number" step="any" name="num2" value="{{ num2|default:'' }}" placeholder="Ej. 25" required>
            </div>
            
            <button type="submit">Calcular Suma</button>
        </form>
        
        <div class="result" id="resultado">
            {% if resultado is not None %}
                Resultado: {{ resultado }}
            {% else %}
                Resultado: --
            {% endif %}
        </div>
    </div>
</body>
</html>
