name: Django CI Pipeline

on:
  push:
    branches: [ "main", "feature/actualizado" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Descargar código del repositorio
      uses: actions/checkout@v4

    - name: Configurar versión de Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar dependencias y Django
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Ejecutar pruebas y verificar el proyecto
      run: |
        python manage.py test