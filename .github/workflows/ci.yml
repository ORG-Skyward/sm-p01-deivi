name: Python CI

on:
  push:
    branches: [ "main", "feature/actualizado" ]
  pull_request:
    branches: [ "main" ]

jobs:
  probar-python:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar código del repositorio
      uses: actions/checkout@v4

    - name: Configurar versión de Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Ejecutar script de Python
      run: |
        python -c "num1 = 15; num2 = 25; print(f'El resultado de sumar {num1} + {num2} es: {num1 + num2}')"