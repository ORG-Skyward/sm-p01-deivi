name: CI Pipeline

on: push

jobs:
  # 1. Primer trabajo: Calculadora estática (Versión 1)
  test_calculadora:
    runs-on: ubuntu-latest
    environment:
      name: Calculadora Estática
      url: https://ORG-Skyward.github.io/sm-p01-deivi/
    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generar sitio web estático
        run: python src/main.py

  # 2. Segundo trabajo: Pruebas unitarias en Django (Versión 2)
  test_django:
    runs-on: ubuntu-latest
    needs: test_calculadora
    environment:
      name: Django CI Pipeline
      url: https://github.com/ORG-Skyward/sm-p01-deivi
    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verificar configuración de Django
        run: python manage.py check

      - name: Ejecutar pruebas unitarias de Django
        run: python manage.py test