name: Deploy Web Page CI/CD

on:
  push:
    branches: [ "main", "feature/actualizado" ]

# Permisos necesarios para que GitHub pueda publicar en Pages
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Descargar código del repositorio
      uses: actions/checkout@v4

    - name: Configurar versión de Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Ejecutar script de Python para crear el HTML
      run: python src/main.py

    - name: Configurar GitHub Pages
      uses: actions/configure-pages@v4

    - name: Subir artefacto HTML
      uses: actions/upload-pages-artifact@v3
      with:
        path: '.' # Toma el index.html que genera tu Python en la raíz

    - name: Desplegar en GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4